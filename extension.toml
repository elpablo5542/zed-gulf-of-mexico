id = "gulf-of-mexico"
name = "Gulf of Mexico"
version = "0.1.0"
schema_version = 1
authors = ["elpablo5542"]
description = "Gulf of Mexico (formerly DreamBerd): syntax highlighting, snippets, and completion plus diagnostics through `gom --lsp`."
repository = "https://github.com/elpablo5542/zed-gulf-of-mexico"
snippets = "snippets/gulf of mexico.json"

# The tree-sitter grammar lives in its own repository. `rev` is the commit
# Zed checks out; bump it after changing the grammar. `dev-install.sh` can
# swap this for a local checkout (file:// URL) to try unpublished changes.
[grammars.gom]
repository = "https://github.com/elpablo5542/tree-sitter-gom"
rev = "630f94df8a4430199ac81984a1e92409b09c2674"

# The interpreter is the language server: `gom --lsp`.
[language_servers.gom]
name = "Gulf of Mexico"
languages = ["Gulf of Mexico"]
